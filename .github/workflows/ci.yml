# AutoTarefas - Integracao Continua
#
# Valida:
# - qualidade e testes da aplicacao Python;
# - backend do Live System;
# - dependencias, tipos, testes e build do frontend.
#
# Os testes com navegador real permanecem fora da CI rapida.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Qualidade (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,demo]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formatacao)
        run: ruff format --check .

      - name: Mypy (tipos)
        run: mypy src/

      - name: Bandit (seguranca)
        run: bandit -c pyproject.toml -r src

      - name: Pytest (suite principal e cobertura)
        run: pytest

      - name: Pytest (backend Live)
        if: matrix.python-version == '3.13'
        run: pytest apps/api/tests --no-cov

  frontend:
    name: Frontend Live (Node 22)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # O portao bloqueante responde a pergunta que importa para quem instala:
      # o que a gente PUBLICA esta vulneravel? A auditoria completa continua
      # existindo abaixo, informativa, depois do build.
      - name: Auditar dependencias de producao
        run: npm audit --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      # Informativa, e no fim de proposito. Quando ela bloqueava e vinha
      # primeiro, um advisory numa dependencia transitiva de build pulava
      # typecheck, testes e build — e podia esconder um erro de TypeScript real.
      # Portao que mascara falha verdadeira e pior que portao nenhum.
      - name: Auditar todas as dependencias (informativo)
        run: npm audit
        continue-on-error: true
